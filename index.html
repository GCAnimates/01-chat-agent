<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#071a33">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
    <title>01 Mobile</title>
  </head>
  <body>
    <main class="shell">
      <header><div class="eyes"><i></i><i></i></div><strong>01</strong><button id="settings-button" class="icon-button" aria-label="Connection settings">•••</button><span id="connection">Ollama Cloud</span></header>
      <section id="chat">
        <div id="messages" aria-live="polite"><div class="intro"><div class="large-eyes"><i></i><i></i></div><h1>Hi, I’m 01.</h1><p>Your personal Ollama Cloud chat. No computer connection or sync is needed.</p></div></div>
        <form id="composer"><input id="message" autocomplete="off" placeholder="Message 01"><button>Send</button></form>
      </section>
      <section class="card settings">
        <button id="clear-chat" class="quiet">Delete this chat</button>
        <p>01 Mobile is chat-only. It cannot see or control your computer.</p>
      </section>
      <section id="connection-settings" class="card settings hidden">
        <h2>Connect to 01 Cloud</h2>
        <label>01 Cloud server<input id="server-url" inputmode="url" placeholder="https://01-mobile-cloud.onrender.com"></label>
        <label>Access key<input id="access-key" type="password" autocomplete="off" placeholder="From your Render settings"></label>
        <button id="save-connection">Save connection</button>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
