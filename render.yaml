services:
  - type: web
    name: 01-mobile-cloud
    runtime: python
    rootDir: mobile_server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MOBILE_OLLAMA_MODEL
        value: glm-5.1:cloud
      - key: OLLAMA_API_KEY
        sync: false
      - key: MOBILE_ACCESS_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
